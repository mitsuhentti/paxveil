name: paxveil
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'
x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://paxveil:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/paxveil
    PAXVEIL_CACHE_DIR: /app/runtime/cache
    PAXVEIL_API_URL: http://api:8000
  volumes:
    - source-cache:/app/runtime
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  tmpfs: ['/tmp:rw,noexec,nosuid,size=268435456']
  init: true
  pids_limit: 128
  stop_grace_period: 30s
  logging: *logging
  restart: unless-stopped
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: paxveil
      POSTGRES_DB: paxveil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U paxveil -d paxveil']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    shm_size: 128m
    stop_grace_period: 60s
    logging: *logging
  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    restart: 'no'
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=5)']
      interval: 20s
      timeout: 6s
      retries: 3
  worker:
    <<: *backend
    command: [python, -m, paxveil.worker]
    depends_on:
      api: {condition: service_healthy}
  bot:
    <<: *backend
    profiles: [telegram]
    command: [python, -m, paxveil.bot]
    depends_on:
      api: {condition: service_healthy}
  web:
    profiles: [web]
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      api: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    init: true
    pids_limit: 128
    stop_grace_period: 30s
    logging: *logging
volumes:
  postgres-data:
  source-cache:
